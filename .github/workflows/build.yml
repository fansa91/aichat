name: build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
          # 构建校验：Tailwind 工具类必须被编译进 CSS（防漏配 @tailwindcss/vite 插件）
          CSS=$(ls dist/assets/*.css | head -1)
          grep -q "@tailwind" "$CSS" && { echo "ERROR: uncompiled @tailwind directive in $CSS"; exit 1; }
          for u in '\.flex{' '\.items-center' '\.rounded-md'; do
            grep -q "$u" "$CSS" || { echo "ERROR: utility $u missing in $CSS"; exit 1; }
          done
          echo "web build OK: $CSS"
          tar -czf ../aichat-web-dist.tar.gz -C dist .

      - name: Build api
        run: |
          cd api
          npm ci --no-audit --no-fund
          npx tsc
          npm prune --omit=dev
          tar -czf ../aichat-api-dist.tar.gz dist migrations package.json node_modules

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: false
          files: |
            aichat-web-dist.tar.gz
            aichat-api-dist.tar.gz
            deploy/deploy.sh
            deploy/aichat-api.service
            deploy/Caddyfile
